[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "better-agent"
version = "0.1.0"
description = "A small event-command coding-agent microkernel."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai==1.107.5",
]

[project.scripts]
ba = "better_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.3.0",
    "pytest-benchmark>=5.2.3",
    "ruff>=0.15.17",
    "ty>=0.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/better_agent"]

[tool.pytest.ini_options]
addopts = "-s"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
